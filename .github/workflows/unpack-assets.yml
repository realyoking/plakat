name: Unpack assets

on:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/unpack-assets.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode archive, commit binary assets, and clean up bootstrap files
        run: |
          set -euo pipefail
          test -d bootstrap
          cat bootstrap/chunk-*.b64 | base64 -d > /tmp/assets.tar
          tar -xf /tmp/assets.tar -C .
          test -f assets/stickers/trophy.png
          test -f assets/backgrounds/azure-sky.jpg
          test -f assets/textures/grain.png
          rm -rf bootstrap
          rm -f .github/workflows/unpack-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add sticker, background, and texture assets"
          git push
